autoDedupe: true

saveExact: true
nodeVersion: 24.22.1

publicHoistPattern:
    - eslint
    - husky
    - lint-staged
    - prettier
    - stylelint

lockfile:
    includeResolutionSettings: true

trustPolicy: no-downgrade
trustPolicyIgnoreAfter: 86400 # 1 day
minimumReleaseAgeExclude:
    - "@timbic/*"

skills:
    dirs: []
