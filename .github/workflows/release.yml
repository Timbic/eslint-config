name: Release

on:
    push:
        tags:
            - v*

jobs:
    publish:
        runs-on: ubuntu-latest
        permissions:
            contents: read
            id-token: write
        steps:
            - uses: actions/checkout@v7.0.1
              with:
                  persist-credentials: false

            - uses: pnpm/setup@v3.2.0
              with:
                  runtime: node@24
                  require-lockfile: true

            - run: pnpm build
            - run: pnpm publish --no-git-checks --provenance
    release:
        runs-on: ubuntu-latest
        needs: publish
        permissions:
            contents: write
        steps:
            - uses: actions/checkout@v7.0.1
              with:
                  persist-credentials: false
                  fetch-depth: 0

            - uses: pnpm/setup@v3.2.0
              with:
                  runtime: node@24
                  require-lockfile: true

            - run: pnx changelogithub
              env:
                  GITHUB_TOKEN: ${{secrets.GITHUB_TOKEN}}
